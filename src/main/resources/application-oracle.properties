# Hibernate creates missing tables/columns and keeps your data between restarts.
spring.jpa.hibernate.ddl-auto=update
# data.sql (the menu) is not run automatically: it would insert the sandwiches again at every start.
# Run it once by hand in your schema, or change this to "always" for the first start only.
spring.sql.init.mode=never
