spring.application.name=sandwich

# Embedded H2 database in Oracle mode: runs without installing anything.
# schema.sql and data.sql are executed at startup. Use the "oracle" profile for the real Oracle database
# (see application-oracle.properties).
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=Oracle;DB_CLOSE_DELAY=-1

# Directory where "print order" writes its .txt files
sandwich.print.directory=orders

# API documentation: http://localhost:8080/swagger-ui.html (JSON: /v3/api-docs)
springdoc.swagger-ui.operations-sorter=method
